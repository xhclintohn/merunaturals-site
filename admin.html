<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meru Naturals Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .admin-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #2d5016 0%, #3a641f 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .login-screen {
            padding: 50px 40px;
            text-align: center;
        }
        
        .login-icon {
            font-size: 60px;
            color: #2d5016;
            margin-bottom: 30px;
        }
        
        .password-container {
            position: relative;
            margin-bottom: 25px;
        }
        
        .password-input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .password-input:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e6b325 0%, #ffd740 100%);
            color: #2d5016;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(230, 179, 37, 0.4);
        }
        
        .admin-panel {
            display: none;
        }
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        
        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #2d5016;
            border-bottom-color: #e6b325;
            background: white;
        }
        
        .tab-content {
            padding: 30px;
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .category-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .category-btn {
            flex: 1;
            padding: 20px;
            border: 3px solid #e9ecef;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .category-btn.active {
            border-color: #2d5016;
            background: #f8fff0;
            color: #2d5016;
            transform: scale(1.02);
        }
        
        .price-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .price-label {
            color: #2d5016;
            font-weight: bold;
            font-size: 18px;
            min-width: 50px;
        }
        
        .file-upload {
            padding: 30px;
            border: 3px dashed #ced4da;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        
        .file-upload:hover {
            border-color: #2d5016;
            background: #f8fff0;
        }
        
        .file-upload input {
            display: none;
        }
        
        .image-preview {
            margin: 25px 0;
            text-align: center;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            border: 3px solid #e6b325;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .upload-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2d5016 0%, #3a641f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(45, 80, 22, 0.4);
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .products-grid {
            margin-top: 25px;
        }
        
        .product-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-color: #2d5016;
        }
        
        .product-image {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 8px;
            border: 3px solid #e6b325;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        
        .product-price {
            font-size: 28px;
            font-weight: 800;
            color: #e6b325;
            margin-bottom: 10px;
        }
        
        .product-filename {
            color: #495057;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 20px;
        }
        
        .delete-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc3545 0%, #e35d6a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .delete-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.3);
        }
        
        .hidden {
            display: none !important;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        @media (max-width: 600px) {
            .admin-container {
                border-radius: 10px;
            }
            
            .login-screen {
                padding: 30px 20px;
            }
            
            .tab-content {
                padding: 20px;
            }
            
            .category-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>Meru Naturals Admin Panel</h1>
            <p>Product Management System</p>
        </div>
        
        <div id="loginScreen" class="login-screen">
            <div class="login-icon">🔐</div>
            <div class="password-container">
                <input type="password" id="adminPassword" class="password-input" placeholder="Enter admin password" autocomplete="off">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('adminPassword')">👁️</button>
            </div>
            <button class="login-btn" onclick="login()">Login to Dashboard</button>
        </div>
        
        <div id="adminPanel" class="admin-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('upload')">📤 Upload Product</div>
                <div class="tab" onclick="switchTab('manage')">📋 Manage Products</div>
            </div>
            
            <div id="uploadTab" class="tab-content active">
                <div class="category-selector">
                    <button class="category-btn active" onclick="selectCategory('tote')">
                        <div style="font-size: 24px; margin-bottom: 8px;">👜</div>
                        Tote Bags
                    </button>
                    <button class="category-btn" onclick="selectCategory('skin')">
                        <div style="font-size: 24px; margin-bottom: 8px;">✨</div>
                        Skin & Hair Care
                    </button>
                </div>
                <input type="hidden" id="selectedCategory" value="tote">
                
                <div class="price-container">
                    <div class="price-label">KSH</div>
                    <input type="number" id="productPrice" class="password-input" placeholder="Enter price" min="1" step="1">
                </div>
                
                <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                    <div style="font-size: 48px; color: #2d5016;">📷</div>
                    <div style="margin-top: 15px; color: #2d5016; font-weight: bold; font-size: 18px;">Click to Select Image</div>
                    <div style="margin-top: 8px; color: #6c757d;">Supported: JPG, PNG, GIF</div>
                    <input type="file" id="imageInput" accept="image/*" onchange="previewSelectedImage()">
                </div>
                
                <div id="previewContainer" class="hidden">
                    <div class="image-preview">
                        <img id="previewImage" class="preview-image">
                    </div>
                </div>
                
                <button class="upload-btn" onclick="uploadProduct()">
                    📤 Upload Product to Store
                </button>
                <div id="uploadStatus" class="status-message"></div>
            </div>
            
            <div id="manageTab" class="tab-content">
                <div style="margin-bottom: 25px;">
                    <select id="viewCategory" class="password-input" onchange="loadProducts()">
                        <option value="tote">👜 Tote Bags Collection</option>
                        <option value="skin">✨ Skin & Hair Products</option>
                    </select>
                </div>
                
                <div id="loadingIndicator" class="status-message status-loading hidden">
                    Loading products from store...
                </div>
                
                <div id="productsContainer" class="products-grid">
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 20px;">📦</div>
                        <div>Select a category to view products</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            GITHUB_TOKEN: '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',
            REPO_OWNER: 'xhclintohn',
            REPO_NAME: 'merunaturals-site',
            BRANCH: 'main',
            ADMIN_PASSWORD: 'Mugambi@2020'
        };

        let products = [];

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const button = input.parentElement.querySelector('.toggle-password');
            
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }

        function selectCategory(category) {
            document.getElementById('selectedCategory').value = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.category-btn').classList.add('active');
        }

        function login() {
            const password = document.getElementById('adminPassword').value;
            
            if (password === CONFIG.ADMIN_PASSWORD) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert('❌ Incorrect password. Please try again.');
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'manage') {
                loadProducts();
            }
        }

        function previewSelectedImage() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('previewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function uploadProduct() {
            const category = document.getElementById('selectedCategory').value;
            const price = document.getElementById('productPrice').value;
            const fileInput = document.getElementById('imageInput');
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!price || price < 1) {
                statusDiv.textContent = '❌ Please enter a valid price (minimum 1 KSH)';
                statusDiv.className = 'status-message status-error';
                return;
            }
            
            if (!fileInput.files[0]) {
                statusDiv.textContent = '❌ Please select an image file';
                statusDiv.className = 'status-message status-error';
                return;
            }
            
            try {
                statusDiv.textContent = '⏳ Uploading product to store...';
                statusDiv.className = 'status-message status-loading';
                
                const file = fileInput.files[0];
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 10);
                const filename = `${category}_${timestamp}_${random}.jpg`;
                const folder = category === 'tote' ? 'Images' : 'Images2';
                const path = `${folder}/${price}/${filename}`;
                
                const base64Image = await fileToBase64(file);
                const content = base64Image.split(',')[1];
                
                const response = await fetch(
                    `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${CONFIG.GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify({
                            message: `Added ${category} product - KSH ${price}`,
                            content: content,
                            branch: CONFIG.BRANCH
                        })
                    }
                );
                
                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.textContent = '✅ Product uploaded successfully!';
                    statusDiv.className = 'status-message status-success';
                    
                    document.getElementById('productPrice').value = '';
                    document.getElementById('imageInput').value = '';
                    document.getElementById('previewContainer').classList.add('hidden');
                    
                } else {
                    let errorMessage = result.message || 'Upload failed';
                    
                    if (errorMessage.includes('Bad credentials')) {
                        errorMessage = 'Invalid GitHub token. Please check your token.';
                    } else if (errorMessage.includes('This repository is empty')) {
                        errorMessage = 'Repository not found or is empty.';
                    }
                    
                    throw new Error(errorMessage);
                }
                
            } catch (error) {
                console.error('Upload error:', error);
                statusDiv.textContent = `❌ Error: ${error.message}`;
                statusDiv.className = 'status-message status-error';
            }
        }

        async function loadProducts() {
            const category = document.getElementById('viewCategory').value;
            const folder = category === 'tote' ? 'Images' : 'Images2';
            const loadingDiv = document.getElementById('loadingIndicator');
            const container = document.getElementById('productsContainer');
            
            try {
                loadingDiv.classList.remove('hidden');
                container.innerHTML = '';
                
                const foldersResponse = await fetch(
                    `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/${folder}`,
                    {
                        headers: {
                            'Authorization': `Bearer ${CONFIG.GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                if (foldersResponse.status === 404) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px; margin-bottom: 20px;">📁</div>
                            <div>No products found in this category</div>
                            <div style="margin-top: 10px; font-size: 14px;">Upload some products to get started</div>
                        </div>
                    `;
                    loadingDiv.classList.add('hidden');
                    return;
                }
                
                if (!foldersResponse.ok) {
                    const error = await foldersResponse.json();
                    throw new Error(error.message || 'Failed to load products');
                }
                
                const folders = await foldersResponse.json();
                products = [];
                
                for (const priceFolder of folders) {
                    if (priceFolder.type === 'dir') {
                        const price = priceFolder.name;
                        
                        try {
                            const imagesResponse = await fetch(
                                `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/${folder}/${price}`,
                                {
                                    headers: {
                                        'Authorization': `Bearer ${CONFIG.GITHUB_TOKEN}`,
                                        'Accept': 'application/vnd.github.v3+json'
                                    }
                                }
                            );
                            
                            if (imagesResponse.ok) {
                                const images = await imagesResponse.json();
                                
                                images.forEach(image => {
                                    if (image.type === 'file' && /\.(jpg|jpeg|png|gif|webp)$/i.test(image.name)) {
                                        const imageUrl = `https://raw.githubusercontent.com/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/${CONFIG.BRANCH}/${image.path}`;
                                        
                                        products.push({
                                            path: image.path,
                                            name: image.name,
                                            price: price,
                                            url: imageUrl,
                                            sha: image.sha
                                        });
                                    }
                                });
                            }
                        } catch (err) {
                            console.log(`Skipping folder ${price}:`, err.message);
                        }
                    }
                }
                
                loadingDiv.classList.add('hidden');
                
                if (products.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px; margin-bottom: 20px;">📦</div>
                            <div>No products available in this category</div>
                        </div>
                    `;
                    return;
                }
                
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <img src="${product.url}" 
                             class="product-image" 
                             alt="${product.name}"
                             loading="lazy"
                             onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDYwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjYwMCIgaGVpZ2h0PSI0MDAiIGZpbGw9IiNGNUY1RjUiLz48dGV4dCB4PSIzMDAiIHk9IjIwMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMkQ1MDE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+UHJvZHVjdCBJbWFnZTwvdGV4dD48L3N2Zz4K';">
                        <div class="product-price">KSH ${product.price}</div>
                        <div class="product-filename">${product.name}</div>
                        <button class="delete-btn" onclick="deleteProduct('${product.path}', '${product.sha}')">
                            🗑️ Delete Product
                        </button>
                    `;
                    
                    container.appendChild(card);
                });
                
            } catch (error) {
                console.error('Load error:', error);
                loadingDiv.classList.add('hidden');
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
                        <div>Error loading products</div>
                        <div style="margin-top: 10px; font-size: 14px; color: #dc3545;">${error.message}</div>
                    </div>
                `;
            }
        }

        async function deleteProduct(path, sha) {
            if (!confirm('⚠️ Are you sure you want to delete this product?\n\nThis action cannot be undone!')) {
                return;
            }
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/${path}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${CONFIG.GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify({
                            message: '🗑️ Deleted product from store',
                            sha: sha,
                            branch: CONFIG.BRANCH
                        })
                    }
                );
                
                if (response.ok) {
                    alert('✅ Product deleted successfully!');
                    loadProducts();
                } else {
                    const error = await response.json();
                    throw new Error(error.message || 'Delete failed');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert(`❌ Delete failed: ${error.message}`);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('adminPassword').focus();
            
            document.getElementById('adminPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    login();
                }
            });
        });
    </script>
</body>
</html>
