<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meru Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f8f9fa;min-height:100vh;padding:20px}.admin-box{max-width:800px;margin:0 auto;background:white;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.1)}.admin-header{background:#2d5016;color:white;padding:25px;text-align:center}.admin-header h1{font-size:24px;margin-bottom:5px}.login-area{padding:50px 30px;text-align:center}.login-icon{font-size:48px;color:#2d5016;margin-bottom:25px}.input-box{margin-bottom:20px}.input-field{width:100%;padding:15px;border:2px solid #ddd;border-radius:8px;font-size:16px}.input-field:focus{outline:none;border-color:#2d5016}.pass-wrap{position:relative}.eye-btn{position:absolute;right:15px;top:50%;transform:translateY(-50%);background:none;border:none;color:#666;cursor:pointer;font-size:18px}.main-btn{width:100%;padding:16px;background:#e6b325;color:#2d5016;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}.tabs-row{display:flex;background:#f1f3f5}.tab-btn{flex:1;padding:18px;text-align:center;font-weight:600;color:#6c757d;cursor:pointer;border-bottom:3px solid transparent}.tab-btn.active{color:#2d5016;border-bottom-color:#e6b325;background:white}.tab-content{padding:25px;display:none}.tab-content.active{display:block}.cat-btns{display:flex;gap:10px;margin-bottom:20px}.cat-btn{flex:1;padding:16px;border:2px solid #dee2e6;border-radius:8px;background:white;cursor:pointer;font-weight:600;text-align:center}.cat-btn.active{border-color:#2d5016;background:#f8fff0;color:#2d5016}.price-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}.ksh{color:#2d5016;font-weight:bold;min-width:40px}.upload-box{padding:25px;border:3px dashed #dee2e6;border-radius:8px;text-align:center;cursor:pointer;margin-bottom:20px}.upload-box:hover{border-color:#2d5016;background:#f8fff0}.upload-box input{display:none}.preview-box{margin:20px 0;text-align:center}.preview-img{max-width:100%;max-height:350px;border-radius:8px;border:2px solid #dee2e6}.msg{padding:12px;border-radius:8px;margin:15px 0;text-align:center;font-weight:600}.msg.success{background:#d4edda;color:#155724}.msg.error{background:#f8d7da;color:#721c24}.msg.loading{background:#fff3cd;color:#856404}.item-box{background:white;border:2px solid #dee2e6;border-radius:8px;padding:20px;margin-bottom:15px}.item-img{width:100%;max-height:400px;object-fit:contain;border-radius:6px;border:2px solid #e6b325;margin-bottom:15px}.item-price{font-size:24px;font-weight:800;color:#e6b325;margin-bottom:10px}.del-btn{width:100%;padding:14px;background:#dc3545;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}.hidden{display:none!important}@media (max-width:600px){.tab-content{padding:20px}}
    </style>
</head>
<body>
    <div class="admin-box">
        <div class="admin-header">
            <h1>Meru Admin</h1>
            <p>Product Control</p>
        </div>
        <div id="loginBox" class="login-area">
            <div class="login-icon">🔐</div>
            <div class="input-box">
                <div class="pass-wrap">
                    <input type="password" id="pass" class="input-field" placeholder="Password">
                    <button type="button" class="eye-btn" onclick="togglePass('pass')">👁️</button>
                </div>
            </div>
            <button class="main-btn" onclick="login()">Enter</button>
        </div>
        <div id="adminBox" class="hidden">
            <div class="tabs-row">
                <div class="tab-btn active" onclick="showTab('add')">Add</div>
                <div class="tab-btn" onclick="showTab('view')">View</div>
            </div>
            <div id="addTab" class="tab-content active">
                <div class="cat-btns">
                    <button class="cat-btn active" onclick="setCat('tote')">👜 Bags</button>
                    <button class="cat-btn" onclick="setCat('skin')">✨ Care</button>
                </div>
                <input type="hidden" id="cat" value="tote">
                <div class="price-row">
                    <span class="ksh">KSH</span>
                    <input type="number" id="price" class="input-field" placeholder="Price" min="1">
                </div>
                <div class="upload-box" onclick="document.getElementById('imgPick').click()">
                    <div style="font-size:36px;color:#2d5016">📷</div>
                    <div style="margin-top:10px;color:#2d5016;font-weight:600">Pick Image</div>
                    <input type="file" id="imgPick" accept="image/*" onchange="showPreview()">
                </div>
                <div id="prevBox" class="hidden">
                    <img id="prev" class="preview-img">
                </div>
                <button class="main-btn" onclick="upload()">Upload</button>
                <div id="upMsg" class="msg"></div>
            </div>
            <div id="viewTab" class="tab-content">
                <select id="viewCat" class="input-field" onchange="loadItems()">
                    <option value="tote">Bags</option>
                    <option value="skin">Care</option>
                </select>
                <div id="loadMsg" class="msg loading hidden">Loading...</div>
                <div id="itemsList"></div>
            </div>
        </div>
    </div>
    <script>
        const TOKEN = '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';
        const OWNER = 'xhclintohn';
        const REPO = 'merunaturals-site';
        const BRANCH = 'main';
        const PASS = 'Mugambi@2020';
        
        let items = [];
        
        function togglePass(id) {
            const field = document.getElementById(id);
            const eye = field.parentElement.querySelector('.eye-btn');
            if (field.type === 'password') {
                field.type = 'text';
                eye.textContent = '🙈';
            } else {
                field.type = 'password';
                eye.textContent = '👁️';
            }
        }
        
        function setCat(cat) {
            document.getElementById('cat').value = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.cat-btn').classList.add('active');
        }
        
        function login() {
            const entered = document.getElementById('pass').value;
            if (entered === PASS) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminBox').classList.remove('hidden');
            } else {
                alert('Wrong password');
                document.getElementById('pass').value = '';
            }
        }
        
        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="showTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            if (tab === 'view') loadItems();
        }
        
        function showPreview() {
            const file = document.getElementById('imgPick').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prev').src = e.target.result;
                document.getElementById('prevBox').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        
        async function upload() {
            const cat = document.getElementById('cat').value;
            const price = document.getElementById('price').value;
            const fileInput = document.getElementById('imgPick');
            const msg = document.getElementById('upMsg');
            
            if (!price || price < 1) {
                msg.textContent = 'Enter price';
                msg.className = 'msg error';
                return;
            }
            
            if (!fileInput.files[0]) {
                msg.textContent = 'Pick image';
                msg.className = 'msg error';
                return;
            }
            
            try {
                msg.textContent = 'Uploading...';
                msg.className = 'msg loading';
                
                const file = fileInput.files[0];
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 8);
                const filename = `${cat}_${timestamp}_${random}.jpg`;
                const folder = cat === 'tote' ? 'Images' : 'Images2';
                const path = `${folder}/${price}/${filename}`;
                
                const base64 = await toBase64(file);
                const content = base64.split(',')[1];
                
                const response = await fetch(
                    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Added ${cat} KSH ${price}`,
                            content: content,
                            branch: BRANCH
                        })
                    }
                );
                
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('price').value = '';
                    document.getElementById('imgPick').value = '';
                    document.getElementById('prevBox').classList.add('hidden');
                    msg.textContent = 'Uploaded!';
                    msg.className = 'msg success';
                } else {
                    throw new Error(result.message || 'Upload failed');
                }
                
            } catch (error) {
                console.error('Upload error:', error);
                msg.textContent = `Error: ${error.message}`;
                msg.className = 'msg error';
            }
        }
        
        async function loadItems() {
            const cat = document.getElementById('viewCat').value;
            const folder = cat === 'tote' ? 'Images' : 'Images2';
            const loading = document.getElementById('loadMsg');
            const list = document.getElementById('itemsList');
            
            try {
                loading.classList.remove('hidden');
                list.innerHTML = '';
                
                const foldersRes = await fetch(
                    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}`,
                    {
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`
                        }
                    }
                );
                
                if (foldersRes.status === 404) {
                    list.innerHTML = '<div style="padding:40px;text-align:center;color:#666">No items</div>';
                    loading.classList.add('hidden');
                    return;
                }
                
                if (!foldersRes.ok) throw new Error('Load failed');
                const folders = await foldersRes.json();
                items = [];
                
                for (const priceFolder of folders) {
                    if (priceFolder.type === 'dir') {
                        const price = priceFolder.name;
                        const imagesRes = await fetch(
                            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}/${price}`,
                            {
                                headers: {
                                    'Authorization': `Bearer ${TOKEN}`
                                }
                            }
                        );
                        
                        if (imagesRes.ok) {
                            const images = await imagesRes.json();
                            images.forEach(img => {
                                if (img.type === 'file' && /\.(jpg|jpeg|png|gif|webp)$/i.test(img.name)) {
                                    const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${img.path}`;
                                    items.push({
                                        path: img.path,
                                        name: img.name,
                                        price: price,
                                        url: url,
                                        sha: img.sha
                                    });
                                }
                            });
                        }
                    }
                }
                
                loading.classList.add('hidden');
                
                if (items.length === 0) {
                    list.innerHTML = '<div style="padding:40px;text-align:center;color:#666">No items</div>';
                    return;
                }
                
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item-box';
                    div.innerHTML = `
                        <img src="${item.url}" class="item-img" alt="${item.name}">
                        <div class="item-price">KSH ${item.price}</div>
                        <button class="del-btn" onclick="deleteItem('${item.path}', '${item.sha}')">Delete</button>
                    `;
                    list.appendChild(div);
                });
                
            } catch (error) {
                loading.classList.add('hidden');
                list.innerHTML = `<div style="padding:40px;text-align:center;color:#721c24">Error: ${error.message}</div>`;
            }
        }
        
        async function deleteItem(path, sha) {
            if (!confirm('Delete this?')) return;
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: 'Deleted',
                            sha: sha,
                            branch: BRANCH
                        })
                    }
                );
                
                if (response.ok) {
                    alert('Deleted!');
                    loadItems();
                } else {
                    const result = await response.json();
                    throw new Error(result.message || 'Delete failed');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('pass').focus();
            document.getElementById('pass').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
