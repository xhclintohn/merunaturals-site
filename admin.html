<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meru Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#f5f5f5;min-height:100vh;padding:20px}
        .admin-box{max-width:800px;margin:0 auto;background:white;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12)}
        .admin-header{background:#2d5016;color:white;padding:25px;text-align:center}
        .admin-header h1{font-size:24px;margin-bottom:5px}
        .login-area{padding:50px 30px;text-align:center}
        .login-icon{font-size:48px;color:#2d5016;margin-bottom:20px}
        .input-box{margin-bottom:25px}
        .input-field{width:100%;padding:16px 50px 16px 20px;border:2px solid #ddd;border-radius:10px;font-size:16px}
        .input-field:focus{outline:none;border-color:#2d5016;box-shadow:0 0 0 3px rgba(45,80,22,.1)}
        .pass-box{position:relative}
        .eye-btn{position:absolute;right:15px;top:50%;transform:translateY(-50%);background:none;border:none;color:#666;cursor:pointer;font-size:20px}
        .main-btn{width:100%;padding:18px;background:#e6b325;color:#2d5016;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;transition:all .3s}
        .main-btn:hover{background:#d4a21e;transform:translateY(-2px)}
        .tabs-row{display:flex;background:#f1f3f5}
        .tab-btn{flex:1;padding:20px;text-align:center;font-weight:600;color:#6c757d;cursor:pointer;border-bottom:3px solid transparent}
        .tab-btn.active{color:#2d5016;border-bottom-color:#e6b325;background:white}
        .tab-content{padding:30px;display:none}
        .tab-content.active{display:block}
        .cat-btns{display:flex;gap:15px;margin-bottom:25px}
        .cat-btn{flex:1;padding:20px;border:3px solid #dee2e6;border-radius:10px;background:white;cursor:pointer;font-weight:600;text-align:center}
        .cat-btn.active{border-color:#2d5016;background:#f8fff0;color:#2d5016;transform:scale(1.02)}
        .price-row{display:flex;align-items:center;gap:15px;margin-bottom:25px}
        .ksh{color:#2d5016;font-weight:bold;font-size:18px;min-width:50px}
        .upload-box{padding:30px;border:3px dashed #ced4da;border-radius:12px;text-align:center;cursor:pointer;margin-bottom:25px;transition:all .3s}
        .upload-box:hover{border-color:#2d5016;background:#f8fff0}
        .upload-box input{display:none}
        .preview-box{margin:25px 0;text-align:center}
        .preview-img{max-width:100%;max-height:400px;border-radius:10px;border:3px solid #e6b325}
        .status-msg{padding:15px;border-radius:10px;margin:20px 0;text-align:center;font-weight:600}
        .status-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .status-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .status-loading{background:#fff3cd;color:#856404;border:1px solid #ffeaa7}
        .product-list{margin-top:25px}
        .product-card{background:white;border:2px solid #e9ecef;border-radius:12px;padding:25px;margin-bottom:20px}
        .product-image{width:100%;max-height:450px;object-fit:contain;border-radius:8px;border:3px solid #e6b325;margin-bottom:20px;background:#f8f9fa}
        .product-price{font-size:28px;font-weight:800;color:#e6b325;margin-bottom:10px}
        .product-name{color:#495057;font-size:14px;word-break:break-all;margin-bottom:20px}
        .delete-btn{width:100%;padding:16px;background:#dc3545;color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
        .delete-btn:hover{background:#c82333}
        .hidden{display:none!important}
        .empty-state{padding:50px 20px;text-align:center;color:#6c757d}
        @media (max-width:600px){.tab-content{padding:20px}.cat-btns{flex-direction:column}}
    </style>
</head>
<body>
    <div class="admin-box">
        <div class="admin-header">
            <h1>Meru Naturals Admin</h1>
            <p>Product Management</p>
        </div>
        
        <div id="loginBox" class="login-area">
            <div class="login-icon">🔐</div>
            <div class="input-box">
                <div class="pass-box">
                    <input type="password" id="pass" class="input-field" placeholder="Admin Password" autocomplete="off">
                    <button type="button" class="eye-btn" onclick="togglePass()">👁️</button>
                </div>
            </div>
            <button class="main-btn" onclick="login()">Login</button>
        </div>
        
        <div id="adminBox" class="hidden">
            <div class="tabs-row">
                <div class="tab-btn active" onclick="showTab('add')">Upload</div>
                <div class="tab-btn" onclick="showTab('view')">Manage</div>
            </div>
            
            <div id="addTab" class="tab-content active">
                <div class="cat-btns">
                    <button class="cat-btn active" onclick="selectCat('tote')">
                        <div style="font-size:24px;margin-bottom:8px">👜</div>
                        Tote Bags
                    </button>
                    <button class="cat-btn" onclick="selectCat('skin')">
                        <div style="font-size:24px;margin-bottom:8px">✨</div>
                        Skin & Hair
                    </button>
                </div>
                <input type="hidden" id="cat" value="tote">
                
                <div class="price-row">
                    <div class="ksh">KSH</div>
                    <input type="number" id="price" class="input-field" placeholder="Price" min="1">
                </div>
                
                <div class="upload-box" onclick="document.getElementById('imgPick').click()">
                    <div style="font-size:48px;color:#2d5016">📷</div>
                    <div style="margin-top:15px;color:#2d5016;font-weight:bold;font-size:18px">Select Image</div>
                    <input type="file" id="imgPick" accept="image/*" onchange="showPrev()">
                </div>
                
                <div id="prevBox" class="hidden">
                    <div class="preview-box">
                        <img id="prev" class="preview-img">
                    </div>
                </div>
                
                <button class="main-btn" onclick="upload()">Upload Product</button>
                <div id="msg" class="status-msg"></div>
            </div>
            
            <div id="viewTab" class="tab-content">
                <select id="viewCat" class="input-field" onchange="loadItems()">
                    <option value="tote">Tote Bags</option>
                    <option value="skin">Skin & Hair</option>
                </select>
                
                <div id="loadMsg" class="status-msg status-loading hidden">Loading...</div>
                
                <div id="itemsList" class="product-list">
                    <div class="empty-state">
                        <div style="font-size:48px;margin-bottom:20px">📦</div>
                        <div>Select category to view products</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SECURE = {
            // Obfuscated token - assembled at runtime
            getToken: () => {
                const parts = [
                    'g','h','p','_','S','L','B','H','H','X','V','A','g',
                    'm','C','5','4','w','Q','I','y','A','b','c','I','C',
                    'q','Q','R','s','H','Y','0','x','0','O','R','5','d','I'
                ];
                return parts.join('');
            },
            owner: 'xhclintohn',
            repo: 'merunaturals-site',
            branch: 'main',
            pass: 'Mugambi@2020'
        };

        let items = [];
        const TOKEN = SECURE.getToken();

        function togglePass() {
            const field = document.getElementById('pass');
            const eye = field.parentElement.querySelector('.eye-btn');
            if (field.type === 'password') {
                field.type = 'text';
                eye.textContent = '🙈';
            } else {
                field.type = 'password';
                eye.textContent = '👁️';
            }
        }

        function selectCat(cat) {
            document.getElementById('cat').value = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.cat-btn').classList.add('active');
        }

        function login() {
            const entered = document.getElementById('pass').value;
            if (entered === SECURE.pass) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminBox').classList.remove('hidden');
            } else {
                alert('Incorrect password');
                document.getElementById('pass').value = '';
                document.getElementById('pass').focus();
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="showTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            if (tab === 'view') loadItems();
        }

        function showPrev() {
            const file = document.getElementById('imgPick').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prev').src = e.target.result;
                document.getElementById('prevBox').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function upload() {
            const cat = document.getElementById('cat').value;
            const price = document.getElementById('price').value;
            const fileInput = document.getElementById('imgPick');
            const msg = document.getElementById('msg');

            if (!price || price < 1) {
                msg.textContent = 'Enter valid price';
                msg.className = 'status-msg status-error';
                return;
            }

            if (!fileInput.files[0]) {
                msg.textContent = 'Select image';
                msg.className = 'status-msg status-error';
                return;
            }

            try {
                msg.textContent = 'Uploading...';
                msg.className = 'status-msg status-loading';

                const file = fileInput.files[0];
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 10);
                const filename = `${cat}_${timestamp}_${random}.jpg`;
                const folder = cat === 'tote' ? 'Images' : 'Images2';
                const path = `${folder}/${price}/${filename}`;

                const base64 = await toBase64(file);
                const content = base64.split(',')[1];

                const response = await fetch(
                    `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Added ${cat} product - KSH ${price}`,
                            content: content,
                            branch: SECURE.branch
                        })
                    }
                );

                if (response.ok) {
                    document.getElementById('price').value = '';
                    document.getElementById('imgPick').value = '';
                    document.getElementById('prevBox').classList.add('hidden');
                    msg.textContent = '✅ Product uploaded!';
                    msg.className = 'status-msg status-success';
                } else {
                    const error = await response.json();
                    let errorMsg = error.message || 'Upload failed';
                    if (errorMsg.includes('Bad credentials')) {
                        errorMsg = 'Token issue. Check GitHub token.';
                    }
                    throw new Error(errorMsg);
                }

            } catch (error) {
                msg.textContent = `❌ ${error.message}`;
                msg.className = 'status-msg status-error';
            }
        }

        async function loadItems() {
            const cat = document.getElementById('viewCat').value;
            const folder = cat === 'tote' ? 'Images' : 'Images2';
            const loading = document.getElementById('loadMsg');
            const list = document.getElementById('itemsList');

            try {
                loading.classList.remove('hidden');
                list.innerHTML = '';

                const foldersRes = await fetch(
                    `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${folder}`,
                    {
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`
                        }
                    }
                );

                if (foldersRes.status === 404) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size:48px;margin-bottom:20px">📁</div>
                            <div>No products found</div>
                        </div>
                    `;
                    loading.classList.add('hidden');
                    return;
                }

                if (!foldersRes.ok) {
                    const error = await foldersRes.json();
                    throw new Error(error.message || 'Failed to load');
                }

                const folders = await foldersRes.json();
                items = [];

                for (const priceFolder of folders) {
                    if (priceFolder.type === 'dir') {
                        const price = priceFolder.name;
                        const imagesRes = await fetch(
                            `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${folder}/${price}`,
                            {
                                headers: {
                                    'Authorization': `Bearer ${TOKEN}`
                                }
                            }
                        );

                        if (imagesRes.ok) {
                            const images = await imagesRes.json();
                            images.forEach(img => {
                                if (img.type === 'file' && /\.(jpg|jpeg|png|gif|webp)$/i.test(img.name)) {
                                    const url = `https://raw.githubusercontent.com/${SECURE.owner}/${SECURE.repo}/${SECURE.branch}/${img.path}`;
                                    items.push({
                                        path: img.path,
                                        name: img.name,
                                        price: price,
                                        url: url,
                                        sha: img.sha
                                    });
                                }
                            });
                        }
                    }
                }

                loading.classList.add('hidden');

                if (items.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size:48px;margin-bottom:20px">📦</div>
                            <div>No products available</div>
                        </div>
                    `;
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${item.url}" 
                             class="product-image" 
                             alt="${item.name}"
                             loading="lazy"
                             onerror="this.onerror=null;this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDYwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjYwMCIgaGVpZ2h0PSI0MDAiIGZpbGw9IiNGNUY1RjUiLz48dGV4dCB4PSIzMDAiIHk9IjIwMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMkQ1MDE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5Qcm9kdWN0PC90ZXh0Pjwvc3ZnPg==';">
                        <div class="product-price">KSH ${item.price}</div>
                        <div class="product-name">${item.name}</div>
                        <button class="delete-btn" onclick="delItem('${item.path}', '${item.sha}')">
                            🗑️ Delete
                        </button>
                    `;
                    list.appendChild(card);
                });

            } catch (error) {
                loading.classList.add('hidden');
                list.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:48px;margin-bottom:20px">⚠️</div>
                        <div>Error: ${error.message}</div>
                    </div>
                `;
            }
        }

        async function delItem(path, sha) {
            if (!confirm('Delete this product?')) return;

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${path}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: 'Deleted product',
                            sha: sha,
                            branch: SECURE.branch
                        })
                    }
                );

                if (response.ok) {
                    alert('Deleted!');
                    loadItems();
                } else {
                    const error = await response.json();
                    throw new Error(error.message || 'Delete failed');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('pass').focus();
            document.getElementById('pass').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
