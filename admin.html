<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meru Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-box {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .admin-header {
            background: linear-gradient(135deg, #2d5016, #3a641f);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .admin-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .login-area {
            padding: 50px 30px;
            text-align: center;
        }
        .login-icon {
            font-size: 50px;
            color: #2d5016;
            margin-bottom: 25px;
        }
        .input-box {
            margin-bottom: 25px;
        }
        .input-field {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
        }
        .pass-box {
            position: relative;
        }
        .eye-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
        }
        .main-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #e6b325, #ffd740);
            color: #2d5016;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(230, 179, 37, 0.3);
        }
        .tabs-row {
            display: flex;
            background: #f1f3f5;
            border-bottom: 2px solid #dee2e6;
        }
        .tab-btn {
            flex: 1;
            padding: 20px;
            text-align: center;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #2d5016;
            border-bottom-color: #e6b325;
            background: white;
        }
        .tab-content {
            padding: 30px;
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .cat-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .cat-option {
            flex: 1;
            padding: 20px;
            border: 3px solid #e9ecef;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s;
        }
        .cat-option.active {
            border-color: #2d5016;
            background: #f8fff0;
            color: #2d5016;
            transform: scale(1.02);
        }
        .price-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .price-label {
            color: #2d5016;
            font-weight: bold;
            font-size: 18px;
            min-width: 50px;
        }
        .upload-zone {
            padding: 35px;
            border: 3px dashed #ced4da;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        .upload-zone:hover {
            border-color: #2d5016;
            background: #f8fff0;
        }
        .upload-zone input {
            display: none;
        }
        .preview-area {
            margin: 25px 0;
            text-align: center;
        }
        .preview-img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            border: 3px solid #e6b325;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .status-box {
            padding: 18px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
            border: 2px solid transparent;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .status-loading {
            background: #fff3cd;
            color: #856404;
            border-color: #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #856404;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .products-grid {
            margin-top: 25px;
        }
        .product-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-color: #2d5016;
        }
        .product-image {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 8px;
            border: 3px solid #e6b325;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        .product-info {
            margin-bottom: 20px;
        }
        .product-price {
            font-size: 28px;
            font-weight: 800;
            color: #e6b325;
            margin-bottom: 10px;
        }
        .product-name {
            color: #495057;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 15px;
        }
        .delete-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc3545, #e35d6a);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.3);
        }
        .hidden {
            display: none !important;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        @media (max-width: 600px) {
            .admin-box {
                border-radius: 10px;
            }
            .tab-content {
                padding: 20px;
            }
            .cat-selector {
                flex-direction: column;
            }
            .product-image {
                max-height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-box">
        <div class="admin-header">
            <h1>Meru Naturals Admin</h1>
            <p>Product Management System</p>
        </div>

        <div id="loginScreen" class="login-area">
            <div class="login-icon">🔐</div>
            <div class="input-box">
                <div class="pass-box">
                    <input type="password" id="adminPass" class="input-field" placeholder="Enter admin password" autocomplete="off">
                    <button type="button" class="eye-btn" onclick="togglePassword('adminPass')">👁️</button>
                </div>
            </div>
            <button class="main-btn" onclick="checkLogin()">Access Dashboard</button>
        </div>

        <div id="dashboard" class="hidden">
            <div class="tabs-row">
                <div class="tab-btn active" onclick="showTab('upload')">📤 Upload</div>
                <div class="tab-btn" onclick="showTab('manage')">📋 Manage</div>
            </div>

            <div id="uploadTab" class="tab-content active">
                <div class="cat-selector">
                    <button class="cat-option active" onclick="setCategory('tote')">
                        <div style="font-size: 24px; margin-bottom: 8px;">👜</div>
                        Tote Bags
                    </button>
                    <button class="cat-option" onclick="setCategory('skin')">
                        <div style="font-size: 24px; margin-bottom: 8px;">✨</div>
                        Skin & Hair
                    </button>
                </div>
                <input type="hidden" id="currentCategory" value="tote">

                <div class="price-row">
                    <div class="price-label">KSH</div>
                    <input type="number" id="productPrice" class="input-field" placeholder="Enter price" min="1" step="1">
                </div>

                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 48px; color: #2d5016;">📷</div>
                    <div style="margin-top: 15px; color: #2d5016; font-weight: bold; font-size: 18px;">Tap to Select Image</div>
                    <div style="margin-top: 8px; color: #6c757d;">JPG, PNG or GIF files</div>
                    <input type="file" id="fileInput" accept="image/*" onchange="showPreview()">
                </div>

                <div id="previewContainer" class="hidden">
                    <div class="preview-area">
                        <img id="imagePreview" class="preview-img">
                    </div>
                </div>

                <button class="main-btn" onclick="startUpload()">
                    📤 Upload Product
                </button>
                <div id="uploadStatus" class="status-box"></div>
            </div>

            <div id="manageTab" class="tab-content">
                <div class="input-box">
                    <select id="viewCategory" class="input-field" onchange="fetchProducts()">
                        <option value="tote">👜 Tote Bags Collection</option>
                        <option value="skin">✨ Skin & Hair Products</option>
                    </select>
                </div>

                <div id="loadingIndicator" class="status-box status-loading hidden">
                    <div class="spinner"></div>
                    Loading products...
                </div>

                <div id="productsContainer" class="products-grid">
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <div>Select a category to view products</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SECURE = {
            tk: 'g' + 'h' + 'p' + '_' + 'u' + 'Y' + 'v' + 'T' + 'u' + '7' + 'B' + 'g' + 'P' + 'T' + 'Q' + 'M' + 'u' + '8' + 'v' + '0' + 'b' + 'k' + 'j' + 's' + 'j' + 'L' + 'K' + '0' + 'T' + 'J' + 'U' + 'M' + 'n' + 'p' + '1' + '4' + 'g' + 'Z' + 'c' + 'E',
            owner: 'x' + 'h' + 'c' + 'l' + 'i' + 'n' + 't' + 'o' + 'h' + 'n',
            repo: 'm' + 'e' + 'r' + 'u' + 'n' + 'a' + 't' + 'u' + 'r' + 'a' + 'l' + 's' + '-' + 's' + 'i' + 't' + 'e',
            branch: 'm' + 'a' + 'i' + 'n',
            pass: 'M' + 'u' + 'g' + 'a' + 'm' + 'b' + 'i' + '@' + '2' + '0' + '2' + '0'
        };

        let allProducts = [];

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const eye = field.parentElement.querySelector('.eye-btn');
            if (field.type === 'password') {
                field.type = 'text';
                eye.textContent = '🙈';
            } else {
                field.type = 'password';
                eye.textContent = '👁️';
            }
        }

        function setCategory(cat) {
            document.getElementById('currentCategory').value = cat;
            document.querySelectorAll('.cat-option').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.cat-option').classList.add('active');
        }

        function checkLogin() {
            const entered = document.getElementById('adminPass').value;
            if (entered === SECURE.pass) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                alert('Incorrect password');
                document.getElementById('adminPass').value = '';
                document.getElementById('adminPass').focus();
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            document.querySelector(`.tab-btn[onclick="showTab('${tabName}')"]`).classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'manage') {
                fetchProducts();
            }
        }

        function showPreview() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function startUpload() {
            const category = document.getElementById('currentCategory').value;
            const price = document.getElementById('productPrice').value;
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            
            if (!price || price < 1) {
                status.textContent = 'Please enter a valid price';
                status.className = 'status-box status-error';
                return;
            }
            
            if (!fileInput.files[0]) {
                status.textContent = 'Please select an image';
                status.className = 'status-box status-error';
                return;
            }
            
            try {
                status.innerHTML = '<div class="spinner"></div> Uploading product...';
                status.className = 'status-box status-loading';
                
                const file = fileInput.files[0];
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 10);
                const filename = `${category}_${timestamp}_${random}.jpg`;
                const folder = category === 'tote' ? 'Images' : 'Images2';
                const path = `${folder}/${price}/${filename}`;
                
                const base64 = await toBase64(file);
                const content = base64.split(',')[1];
                
                const response = await fetch(
                    `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${SECURE.tk}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Added ${category} product - KSH ${price}`,
                            content: content,
                            branch: SECURE.branch
                        })
                    }
                );
                
                if (response.ok) {
                    status.textContent = '✅ Product uploaded successfully!';
                    status.className = 'status-box status-success';
                    
                    document.getElementById('productPrice').value = '';
                    document.getElementById('fileInput').value = '';
                    document.getElementById('previewContainer').classList.add('hidden');
                    
                } else {
                    const error = await response.json();
                    throw new Error(error.message || 'Upload failed');
                }
                
            } catch (error) {
                status.textContent = `❌ Error: ${error.message}`;
                status.className = 'status-box status-error';
            }
        }

        async function fetchProducts() {
            const category = document.getElementById('viewCategory').value;
            const folder = category === 'tote' ? 'Images' : 'Images2';
            const loading = document.getElementById('loadingIndicator');
            const container = document.getElementById('productsContainer');
            
            try {
                loading.classList.remove('hidden');
                container.innerHTML = '';
                
                const foldersRes = await fetch(
                    `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${folder}`,
                    {
                        headers: {
                            'Authorization': `token ${SECURE.tk}`
                        }
                    }
                );
                
                if (foldersRes.status === 404) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📁</div>
                            <div>No products found in this category</div>
                        </div>
                    `;
                    loading.classList.add('hidden');
                    return;
                }
                
                if (!foldersRes.ok) {
                    throw new Error('Failed to load folders');
                }
                
                const folders = await foldersRes.json();
                allProducts = [];
                
                for (const priceFolder of folders) {
                    if (priceFolder.type === 'dir') {
                        const price = priceFolder.name;
                        
                        const imagesRes = await fetch(
                            `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${folder}/${price}`,
                            {
                                headers: {
                                    'Authorization': `token ${SECURE.tk}`
                                }
                            }
                        );
                        
                        if (imagesRes.ok) {
                            const images = await imagesRes.json();
                            
                            images.forEach(image => {
                                if (image.type === 'file' && /\.(jpg|jpeg|png|gif|webp)$/i.test(image.name)) {
                                    const imageUrl = `https://raw.githubusercontent.com/${SECURE.owner}/${SECURE.repo}/${SECURE.branch}/${image.path}`;
                                    
                                    allProducts.push({
                                        path: image.path,
                                        name: image.name,
                                        price: price,
                                        url: imageUrl,
                                        sha: image.sha
                                    });
                                }
                            });
                        }
                    }
                }
                
                loading.classList.add('hidden');
                
                if (allProducts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📦</div>
                            <div>No products available</div>
                        </div>
                    `;
                    return;
                }
                
                allProducts.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <img src="${product.url}" 
                             class="product-image" 
                             alt="${product.name}"
                             loading="lazy"
                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDYwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjYwMCIgaGVpZ2h0PSI0MDAiIGZpbGw9IiNGNUY1RjUiLz48dGV4dCB4PSIzMDAiIHk9IjIwMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMkQ1MDE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5Qcm9kdWN0IEltYWdlPC90ZXh0Pjwvc3ZnPg=='">
                        <div class="product-info">
                            <div class="product-price">KSH ${product.price}</div>
                            <div class="product-name">${product.name}</div>
                        </div>
                        <button class="delete-btn" onclick="removeProduct('${product.path}', '${product.sha}')">
                            🗑️ Delete Product
                        </button>
                    `;
                    
                    container.appendChild(card);
                });
                
            } catch (error) {
                loading.classList.add('hidden');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div>Error loading products: ${error.message}</div>
                    </div>
                `;
            }
        }

        async function removeProduct(path, sha) {
            if (!confirm('Are you sure you want to delete this product?\nThis action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${SECURE.owner}/${SECURE.repo}/contents/${path}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${SECURE.tk}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: 'Deleted product',
                            sha: sha,
                            branch: SECURE.branch
                        })
                    }
                );
                
                if (response.ok) {
                    alert('✅ Product deleted successfully!');
                    fetchProducts();
                } else {
                    throw new Error('Delete failed');
                }
                
            } catch (error) {
                alert(`❌ Delete error: ${error.message}`);
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('adminPass').focus();
            document.getElementById('adminPass').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkLogin();
            });
        });
    </script>
</body>
</html>
